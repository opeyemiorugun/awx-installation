# Service catalog: list the services that exist in each namespace. A service in both lists appears twice.
services:
  pilot:
    - integration-channel-example-one
    - integration-channel-example-two
  prod:
    - integration-channel-example-one
    - integration-channel-example-two
# One namespace per environment.
namespaces:
  pilot: integration-pilot
  prod: integration-prod